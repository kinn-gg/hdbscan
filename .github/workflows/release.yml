name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.24.x', cache: true }
      - run: go test ./...
      - name: Reproducible source archives
        shell: bash
        run: |
          version="${GITHUB_REF_NAME}"
          git archive --format=tar --prefix="hdbscan-${version}/" HEAD > "hdbscan-${version}.tar"
          gzip -n -9 "hdbscan-${version}.tar"
          git archive --format=zip --prefix="hdbscan-${version}/" -o "hdbscan-${version}.zip" HEAD
          sha256sum "hdbscan-${version}.tar.gz" "hdbscan-${version}.zip" > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            hdbscan-*.tar.gz
            hdbscan-*.zip
            SHA256SUMS

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        go: ['1.24.x', '1.25.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test ./...

  race-and-fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go test -race ./...
      - run: go test ./internal/evaluation -run '^$' -fuzz FuzzCanonicalLabels -fuzztime 10s
      - run: go test . -run '^$' -fuzz FuzzReference -fuzztime 10s
      - run: go test . -run '^$' -fuzz FuzzBranchDetection -fuzztime 10s
      - run: go test . -run '^$' -fuzz FuzzEuclideanAgreement -fuzztime 10s

  vector-kernels:
    runs-on: ubuntu-24.04
    env:
      GOAMD64: v3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - run: go test ./internal/distance
      - run: go test ./internal/distance -run '^$' -fuzz FuzzVectorKernelParity -fuzztime 10s
      - name: Cross-compile ARM64 vector tests
        env:
          GOOS: linux
          GOARCH: arm64
          GOAMD64: v1
        run: go test -c ./internal/distance -o distance-arm64.test

  arm64-vector-kernels:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Require native ARM64 runner
        run: test "$(go env GOARCH)" = arm64
      - run: go test ./internal/distance
      - run: go test ./internal/distance -run '^$' -fuzz FuzzVectorKernelParity -fuzztime 10s
      - run: go test ./internal/distance -run '^$' -bench BenchmarkScalarVectorBreakEven -benchmem -benchtime 100ms

  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: true
      - run: uv sync --locked --project tools/fixtures
      - run: uv run --project tools/fixtures python tools/fixtures/generate.py --check

  lint:
    name: golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      - run: go test -coverprofile=coverage.out ./...
      - name: Enforce public API snapshot
        run: go test -run TestPublicAPISnapshot .
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  cross-compile:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Compile tests
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go test -exec=true -run '^$' ./...

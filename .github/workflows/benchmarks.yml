name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'testdata/benchmarks/**'
      - '.github/workflows/benchmarks.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Record environment
        shell: bash
        run: |
          {
            go version
            uname -a
            lscpu
            printf 'GOMAXPROCS=%s\n' "$(nproc)"
          } > benchmark-environment.txt
      - name: Run benchmarks without performance gates
        shell: bash
        run: /usr/bin/time -v -o benchmark-rss.txt go test -run '^$' -bench . -benchmem -count 5 ./... | tee benchmark.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            benchmark.txt
            benchmark-rss.txt
            benchmark-environment.txt
